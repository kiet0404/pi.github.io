<style>
:root {
--glass: rgba(20, 20, 20, 0.75);
--glass-border: rgba(255, 255, 255, 0.2);
--rainbow: linear-gradient(90deg, #a8edea, #fed6e3, #fac1ff, #d4fc79, #96e6a1, #a8edea);
--jd-gradient: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
}
body {
margin: 0; padding: 0; background: #000;
font-family: 'Montserrat', sans-serif; color: #fff;
overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
#jsi-flying-fish-container {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
z-index: -1; background: #050505;
}
.main-wrapper { max-width: 900px; margin: 40px auto; padding: 20px; position: relative; z-index: 1; }
.glass-card {
background: var(--glass);
backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
border: 1px solid var(--glass-border);
border-radius: 25px; padding: 35px; margin-bottom: 25px;
box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}
.rainbow-text {
background: var(--rainbow); background-size: 200% auto;
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
animation: rainbow_move 4s linear infinite; font-weight: 800;
}
@keyframes rainbow_move { to { background-position: 200% center; } }
.profile-header { display: flex; align-items: center; gap: 40px; }
.avatar-section { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.avatar-wrap { 
    position: relative; 
    width: 150px; 
    height: 150px; 
}

.avatar-img { 
    width: 110px; 
    height: 110px; 
    border-radius: 50%; 
    object-fit: cover;
    border: 3px solid #fff; 
    position: absolute; 
    top: 20px; 
    left: 20px; 
    z-index: 2; 
    box-shadow: 0 0 20px rgba(255,255,255,0.2); 
}

.avatar-frame { 
    position: absolute; 
    width: 170px; 
    height: 170px; 
    top: -10px; 
    left: -10px; 
    z-index: 3; 
    pointer-events: none; 
}
.henry-gaming { 
margin-top: 10px; 
font-family: 'Orbitron', sans-serif; 
font-size: 0.9rem; 
letter-spacing: 1px;
text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
}
.social-links { display: flex; gap: 12px; margin-top: 20px; }
.social-item {
width: 44px; height: 44px; background: rgba(255, 255, 255, 0.12);
display: flex; align-items: center; justify-content: center;
border-radius: 12px; color: #fff; border: 1px solid var(--glass-border);
transition: 0.4s; text-decoration: none; backdrop-filter: blur(5px);
}
.social-item:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-5px); color: #fff; }
.jd-music-container {
margin: 30px 0 10px 0; padding: 20px; background: rgba(0, 0, 0, 0.3);
border-radius: 20px; border: 1px solid var(--glass-border);
}
#contribution-grid { display: grid; grid-template-columns: repeat(52, 1fr); grid-template-rows: repeat(7, 1fr); gap: 3px; }
.dot { aspect-ratio: 1/1; border-radius: 2px; background: rgba(255,255,255,0.05); }
.dot.jd-active { background-image: var(--jd-gradient); background-size: 800% 800%; animation: jd_glow 2s linear infinite; }
@keyframes jd_glow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.info-item { font-size: 0.9rem; font-weight: 700; padding: 5px 0; }
.info-item i { width: 25px; color: #4facfe; margin-right: 5px; }
.skill-list { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.progress-box { height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 8px; border: 1px solid rgba(255,255,255,0.05); }
.progress-bar { height: 100%; background: var(--rainbow); background-size: 200% auto; animation: rainbow_move 4s linear infinite; }
@media (max-width: 768px) {
.profile-header { flex-direction: column; text-align: center; }
.info-grid, .skill-list { grid-template-columns: 1fr; }
#contribution-grid { grid-template-columns: repeat(26, 1fr); }
.avatar-wrap { margin-bottom: 20px; }
}
</style>
